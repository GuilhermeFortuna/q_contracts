info:
  description: Backend API for fetching market data and executing orders using MetaTrader
    5
  title: QuantLauncher API Backend
  version: 0.1.0
openapi: 3.1.0
paths:
  /:
    get:
      operationId: read_root__get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Read Root
      tags:
      - system
  /api/v1/backtest:
    post:
      description: Dispatch a backtest to the worker pool and return its run id for
        polling.
      operationId: start_backtest_api_v1_backtest_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BacktestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestStartResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Start Backtest
      tags:
      - backtest
  /api/v1/backtest/{run_id}:
    get:
      description: Return the current status of an async backtest run.
      operationId: get_backtest_status_api_v1_backtest__run_id__get
      parameters:
      - in: path
        name: run_id
        required: true
        schema:
          title: Run Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestStatusResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Backtest Status
      tags:
      - backtest
  /api/v1/backtest/{run_id}/result:
    get:
      description: Return the full chart payload for a completed async backtest run.
      operationId: get_backtest_result_api_v1_backtest__run_id__result_get
      parameters:
      - in: path
        name: run_id
        required: true
        schema:
          title: Run Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Backtest Result
      tags:
      - backtest
  /api/v1/backtests:
    get:
      description: Return a paginated list of backtest runs.
      operationId: list_backtests_api_v1_backtests_get
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          title: Offset
          type: integer
      - in: query
        name: symbol
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Symbol
      - in: query
        name: strategy
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Strategy
      - in: query
        name: saved_only
        required: false
        schema:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Saved Only
      - in: query
        name: sort
        required: false
        schema:
          default: created_at_desc
          enum:
          - created_at_desc
          - pnl_desc
          - pnl_asc
          title: Sort
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacktestRunListResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Backtests
      tags:
      - backtest
  /api/v1/backtests/bulk-delete:
    post:
      description: Delete multiple backtest runs in one request.
      operationId: bulk_delete_backtests_api_v1_backtests_bulk_delete_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeleteBacktestsRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDeleteResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Bulk Delete Backtests
      tags:
      - backtest
