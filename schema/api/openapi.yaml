      - genome_param_bounds
      - genome_limits
      - operators
      - condition_groups
      - exit_rules
      - exit_presets
      - risk_sizing
      - execution_assumptions
      - unsupported
      title: CapabilityRegistry
      type: object
    CategoricalParam:
      properties:
        choices:
          items:
            anyOf:
            - type: string
            - type: integer
            - type: number
          title: Choices
          type: array
        type:
          const: categorical
          default: categorical
          title: Type
          type: string
      required:
      - choices
      title: CategoricalParam
      type: object
    ChartIndicatorSeries:
      properties:
        color:
          anyOf:
          - type: string
          - type: 'null'
          title: Color
        key:
          title: Key
          type: string
        label:
          title: Label
          type: string
        pane:
          enum:
          - price
          - oscillator
          title: Pane
          type: string
        values:
          items:
            anyOf:
            - type: number
            - type: 'null'
          title: Values
          type: array
      required:
      - key
      - label
      - pane
      - values
      title: ChartIndicatorSeries
      type: object
    CompileStrategySpecErrorResponse:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/ValidationErrorDetail'
          title: Errors
          type: array
        status:
          default: validation_failed
          enum:
          - validation_failed
          - compile_failed
          title: Status
          type: string
      title: CompileStrategySpecErrorResponse
      type: object
    CompileStrategySpecRequest:
      properties:
        strategy_spec:
          additionalProperties: true
          title: Strategy Spec
          type: object
      required:
      - strategy_spec
      title: CompileStrategySpecRequest
      type: object
    CompileStrategySpecResponse:
      properties:
        compiled_strategy:
          $ref: '#/components/schemas/CompiledStrategy'
        compiled_strategy_id:
          title: Compiled Strategy Id
          type: string
        status:
          const: compiled
          default: compiled
          title: Status
          type: string
      required:
      - compiled_strategy_id
      - compiled_strategy
      title: CompileStrategySpecResponse
      type: object
    CompiledStrategy:
      properties:
        backtest_config:
          $ref: '#/components/schemas/BacktestConfigPayload'
        compiled_id:
          title: Compiled Id
          type: string
        genome:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Genome
        schema_version:
          title: Schema Version
          type: string
        strategy_name:
          title: Strategy Name
          type: string
        strategy_params:
          additionalProperties: true
          title: Strategy Params
          type: object
        summary:
          $ref: '#/components/schemas/CompiledStrategySummary'
      required:
      - compiled_id
      - schema_version
      - strategy_name
      - summary
      - backtest_config
      title: CompiledStrategy
      type: object
    CompiledStrategySummary:
      properties:
        entry_summary:
          title: Entry Summary
          type: string
        exit_summary:
          title: Exit Summary
          type: string
        indicators:
          items:
            type: string
          title: Indicators
          type: array
        mapping:
          title: Mapping
          type: string
        market:
          title: Market
          type: string
        name:
