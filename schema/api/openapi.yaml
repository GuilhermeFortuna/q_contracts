components:
  schemas:
    AiModelOption:
      properties:
        available:
          default: false
          title: Available
          type: boolean
        id:
          title: Id
          type: string
        label:
          title: Label
          type: string
        provider:
          title: Provider
          type: string
      required:
      - id
      - label
      - provider
      title: AiModelOption
      type: object
    AiProviderOption:
      properties:
        id:
          title: Id
          type: string
        label:
          title: Label
          type: string
      required:
      - id
      - label
      title: AiProviderOption
      type: object
    AiStrategyMetadata:
      additionalProperties: false
      description: Additive metadata for AI-authored custom strategies (WO95).
      properties:
        assumptions:
          items:
            type: string
          title: Assumptions
          type: array
        capabilities_version:
          minLength: 1
          title: Capabilities Version
          type: string
        compiled_strategy:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Compiled Strategy
        compiled_strategy_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Compiled Strategy Id
        original_prompt:
          minLength: 1
          title: Original Prompt
          type: string
        strategy_spec:
          additionalProperties: true
          title: Strategy Spec
          type: object
        strategy_spec_version:
          minLength: 1
          title: Strategy Spec Version
          type: string
        unsupported_requests_acknowledged:
          items:
            type: string
          title: Unsupported Requests Acknowledged
          type: array
      required:
      - strategy_spec
      - strategy_spec_version
      - capabilities_version
      - original_prompt
      title: AiStrategyMetadata
      type: object
    AiStrategyModelsResponse:
      properties:
        default_model:
          title: Default Model
          type: string
        models:
          items:
            $ref: '#/components/schemas/AiModelOption'
          title: Models
          type: array
        provider:
          title: Provider
          type: string
        providers:
          items:
            $ref: '#/components/schemas/AiProviderOption'
          title: Providers
          type: array
      required:
      - provider
      - default_model
      title: AiStrategyModelsResponse
      type: object
    AiStrategyResponse:
      properties:
        assumptions:
          items:
            type: string
          title: Assumptions
          type: array
        change_notes:
          items:
            type: string
          title: Change Notes
          type: array
        compiled_strategy:
          anyOf:
          - $ref: '#/components/schemas/CompiledStrategy'
          - type: 'null'
        confidence:
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          type: number
        questions:
          items:
            type: string
          title: Questions
          type: array
        strategy_spec:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Strategy Spec
        summary:
          title: Summary
          type: string
        unsupported_requests:
          items:
            type: string
          title: Unsupported Requests
          type: array
        validation:
          anyOf:
          - $ref: '#/components/schemas/ValidationResult'
          - type: 'null'
      required:
      - summary
      - confidence
      title: AiStrategyResponse
      type: object
    AiStrategyServiceErrorResponse:
      properties:
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
        message:
          title: Message
          type: string
        status:
          enum:
          - ai_disabled
          - ai_misconfigured
          - provider_error
          - parse_error
          title: Status
          type: string
      required:
      - status
      - message
      title: AiStrategyServiceErrorResponse
      type: object
    AlphaResearchComputeBudget:
      description: Bounded compute overrides; profile acceptance thresholds are not
        mutable.
      properties:
        optimization_seeds:
          anyOf:
          - maximum: 10.0
            minimum: 1.0
            type: integer
          - type: 'null'
          title: Optimization Seeds
        study_n_trials:
          anyOf:
          - maximum: 500.0
            minimum: 1.0
            type: integer
          - type: 'null'
          title: Study N Trials
        walkforward:
          anyOf:
          - $ref: '#/components/schemas/WalkForwardConfig'
          - type: 'null'
      title: AlphaResearchComputeBudget
      type: object
    AlphaResearchRequest:
      properties:
        catalog_version:
          anyOf:
          - minimum: 1.0
            type: integer
          - type: 'null'
          title: Catalog Version
        compute_budget:
          anyOf:
          - $ref: '#/components/schemas/AlphaResearchComputeBudget'
          - type: 'null'
        end:
          format: date-time
          title: End
          type: string
        profile_id:
          title: Profile Id
          type: string
        profile_version:
          anyOf:
          - minimum: 1.0
            type: integer
          - type: 'null'
          title: Profile Version
        start:
          format: date-time
          title: Start
          type: string
        target_name:
          default: fwd_return
          title: Target Name
          type: string
      required:
      - profile_id
      - start
      - end
      title: AlphaResearchRequest
      type: object
    AlphaResearchResult:
      properties:
        acceptance:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Acceptance
        champion:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Champion
        coverage:
          additionalProperties: true
          title: Coverage
          type: object
        feature_evidence_summary:
          items:
            additionalProperties: true
            type: object
          title: Feature Evidence Summary
          type: array
        hypothesis_manifest:
          items:
            additionalProperties: true
            type: object
          title: Hypothesis Manifest
          type: array
        inconclusive_reasons:
          items:
            type: string
          title: Inconclusive Reasons
          type: array
        profile_id:
          title: Profile Id
          type: string
        provenance:
          additionalProperties: true
          title: Provenance
          type: object
        split_manifest:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Split Manifest
        stages:
          items:
            $ref: '#/components/schemas/AlphaResearchStageStatus'
          title: Stages
          type: array
        verdict:
          enum:
          - ready_for_paper
          - inconclusive
          - rejected
          title: Verdict
          type: string
      required:
      - verdict
      - profile_id
      title: AlphaResearchResult
      type: object
    AlphaResearchStageStatus:
      properties:
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
        name:
          title: Name
          type: string
        status:
          enum:
          - pending
          - running
          - completed
          - failed
          - skipped
          title: Status
          type: string
      required:
      - name
      - status
      title: AlphaResearchStageStatus
      type: object
    AlphaResearchStartResponse:
      properties:
        job_id:
          title: Job Id
          type: string
        status:
          title: Status
          type: string
      required:
      - job_id
      - status
      title: AlphaResearchStartResponse
      type: object
    AlphaResearchStatusResponse:
      properties:
        checkpoint:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Checkpoint
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        job_id:
          title: Job Id
          type: string
        progress:
          default: 0.0
          title: Progress
          type: number
        result:
          anyOf:
          - $ref: '#/components/schemas/AlphaResearchResult'
          - type: 'null'
        stages:
          items:
            $ref: '#/components/schemas/AlphaResearchStageStatus'
          title: Stages
          type: array
        status:
          enum:
          - queued
          - running
          - completed
          - failed
          - cancelled
          title: Status
          type: string
      required:
      - job_id
      - status
      title: AlphaResearchStatusResponse
      type: object
    AuditEventListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AuditEventResponse'
          title: Items
          type: array
        limit:
          title: Limit
          type: integer
        offset:
          title: Offset
          type: integer
        total:
          title: Total
          type: integer
      required:
      - total
      - limit
      - offset
      - items
      title: AuditEventListResponse
      type: object
    AuditEventResponse:
      properties:
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        created_at:
          format: date-time
          title: Created At
          type: string
        deployment_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Deployment Id
        event_type:
          title: Event Type
          type: string
        id:
          format: uuid
          title: Id
          type: string
        message:
          title: Message
          type: string
        payload:
          additionalProperties: true
          title: Payload
          type: object
      required:
      - id
      - event_type
      - message
      - payload
      - created_at
      title: AuditEventResponse
      type: object
    BacktestConfig:
      properties:
        costs:
          anyOf:
          - $ref: '#/components/schemas/TransactionCostConfig'
          - type: 'null'
        day_trade:
          default: false
          title: Day Trade
          type: boolean
        day_trade_close_time:
          default: '17:00'
          title: Day Trade Close Time
          type: string
        day_trade_end_time:
          default: '16:00'
          title: Day Trade End Time
          type: string
        day_trade_start_time:
          default: 09:00
          title: Day Trade Start Time
          type: string
        display_timeframe:
          default: M1
          title: Display Timeframe
          type: string
        end:
          format: date-time
          title: End
          type: string
        engine:
          default: candle
          enum:
          - candle
          - tick
          title: Engine
          type: string
        entries:
          anyOf:
          - items:
              $ref: '#/components/schemas/EntryInstance'
            type: array
          - type: 'null'
          title: Entries
        entry_manager:
          $ref: '#/components/schemas/EntryManagerConfig'
        exit_params:
          additionalProperties: true
          title: Exit Params
          type: object
        initial_capital:
          default: 100000.0
          exclusiveMinimum: 0.0
          title: Initial Capital
          type: number
        parallel_mode:
          $ref: '#/components/schemas/ParallelMode'
          default: SEQUENTIAL
        point_value:
          default: 1.0
          exclusiveMinimum: 0.0
          title: Point Value
          type: number
        start:
          format: date-time
          title: Start
          type: string
        strategy:
          default: MACrossover
          title: Strategy
          type: string
        symbol:
          title: Symbol
          type: string
        tick_flags:
          anyOf:
          - type: string
          - type: 'null'
          title: Tick Flags
        timeframe:
          default: D1
          title: Timeframe
          type: string
      required:
      - symbol
      - start
      - end
      title: BacktestConfig
      type: object
    BacktestConfigPayload:
      description: Runnable backtest fields derived from a compiled strategy.
      properties:
        execution_assumptions:
          additionalProperties: true
          title: Execution Assumptions
          type: object
        position_sizing:
          additionalProperties: true
          title: Position Sizing
          type: object
        strategy:
          title: Strategy
          type: string
        strategy_params:
          additionalProperties: true
          title: Strategy Params
          type: object
        symbol:
          title: Symbol
          type: string
        timeframe:
          title: Timeframe
          type: string
      required:
      - symbol
      - timeframe
      - strategy
      title: BacktestConfigPayload
      type: object
    BacktestEquityArtifactResponse:
      properties:
        points:
          items:
            $ref: '#/components/schemas/EquityArtifactPoint'
          title: Points
          type: array
        run_id:
          title: Run Id
          type: string
      required:
      - run_id
      - points
      title: BacktestEquityArtifactResponse
      type: object
    BacktestRequest:
      properties:
        costs:
          anyOf:
          - $ref: '#/components/schemas/TransactionCostConfig'
          - type: 'null'
        day_trade:
          default: false
          title: Day Trade
          type: boolean
        day_trade_close_time:
          default: '17:00'
          title: Day Trade Close Time
          type: string
        day_trade_end_time:
          default: '16:00'
          title: Day Trade End Time
          type: string
        day_trade_start_time:
          default: 09:00
          title: Day Trade Start Time
          type: string
        display_timeframe:
          default: M1
          title: Display Timeframe
          type: string
        end:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: End
        engine:
          default: candle
          enum:
          - candle
          - tick
          title: Engine
          type: string
        entries:
          anyOf:
          - items:
              $ref: '#/components/schemas/EntryInstance'
            type: array
          - type: 'null'
          title: Entries
        entry_manager:
          $ref: '#/components/schemas/EntryManagerConfig'
        exit_params:
          additionalProperties: true
          default: {}
          title: Exit Params
          type: object
        initial_capital:
          default: 100000.0
          title: Initial Capital
          type: number
        point_value:
          default: 1.0
          title: Point Value
          type: number
        position_sizing:
          anyOf:
          - discriminator:
              mapping:
                fixed_quantity: '#/components/schemas/FixedQuantityPositionSizing'
                fixed_safety_margin: '#/components/schemas/FixedSafetyMarginPositionSizing'
                inverse_volatility: '#/components/schemas/InverseVolatilityPositionSizing'
              propertyName: type
            oneOf:
            - $ref: '#/components/schemas/FixedQuantityPositionSizing'
            - $ref: '#/components/schemas/FixedSafetyMarginPositionSizing'
            - $ref: '#/components/schemas/InverseVolatilityPositionSizing'
          - type: 'null'
          title: Position Sizing
        start:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Start
        strategy:
          default: MACrossover
          title: Strategy
          type: string
        strategy_params:
          additionalProperties: true
          default: {}
          title: Strategy Params
          type: object
        symbol:
          title: Symbol
          type: string
        tick_flags:
          anyOf:
          - type: string
          - type: 'null'
          title: Tick Flags
        timeframe:
          default: D1
          title: Timeframe
          type: string
      required:
      - symbol
      title: BacktestRequest
      type: object
    BacktestResponse:
      properties:
        bars:
          items:
            $ref: '#/components/schemas/OhlcvBarResponse'
          title: Bars
          type: array
        indicators:
          items:
            $ref: '#/components/schemas/ChartIndicatorSeries'
          title: Indicators
          type: array
        metrics:
          additionalProperties: true
          title: Metrics
          type: object
        run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Run Id
        trades:
          items:
            additionalProperties: true
            type: object
          title: Trades
          type: array
      required:
      - metrics
      - trades
      - bars
      - indicators
      title: BacktestResponse
      type: object
    BacktestRunDetailResponse:
      properties:
        config:
          additionalProperties: true
          title: Config
          type: object
        created_at:
          format: date-time
          title: Created At
          type: string
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
        finished_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Finished At
        is_saved:
          default: false
          title: Is Saved
          type: boolean
        result_summary:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Result Summary
        run_id:
          title: Run Id
          type: string
        started_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Started At
        status:
          title: Status
          type: string
        strategy:
          title: Strategy
          type: string
        symbol:
          title: Symbol
          type: string
        timeframe:
          title: Timeframe
          type: string
      required:
      - run_id
      - symbol
      - strategy
      - timeframe
      - status
      - config
      - created_at
      title: BacktestRunDetailResponse
      type: object
    BacktestRunListItem:
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        is_saved:
          default: false
          title: Is Saved
          type: boolean
        run_id:
          title: Run Id
          type: string
        status:
          title: Status
          type: string
        strategy:
          title: Strategy
          type: string
        summary:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Summary
        symbol:
          title: Symbol
          type: string
        timeframe:
          title: Timeframe
          type: string
      required:
      - run_id
      - symbol
      - strategy
      - timeframe
      - status
      - created_at
      title: BacktestRunListItem
      type: object
    BacktestRunListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/BacktestRunListItem'
          title: Items
          type: array
        limit:
          title: Limit
          type: integer
        offset:
          title: Offset
          type: integer
        total:
          title: Total
          type: integer
      required:
      - items
      - total
      - limit
      - offset
      title: BacktestRunListResponse
      type: object
    BacktestRunPatchRequest:
      properties:
        is_saved:
          title: Is Saved
          type: boolean
      required:
      - is_saved
      title: BacktestRunPatchRequest
      type: object
    BacktestStartResponse:
      properties:
        run_id:
          title: Run Id
          type: string
        status:
          title: Status
          type: string
      required:
      - run_id
      - status
      title: BacktestStartResponse
      type: object
    BacktestStatusResponse:
      properties:
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        run_id:
          title: Run Id
          type: string
        status:
          title: Status
          type: string
      required:
      - run_id
      - status
      title: BacktestStatusResponse
      type: object
    BacktestTradesArtifactResponse:
      properties:
        run_id:
          title: Run Id
          type: string
        trades:
          items:
            additionalProperties: true
            type: object
          title: Trades
          type: array
      required:
      - run_id
      - trades
      title: BacktestTradesArtifactResponse
      type: object
    BulkDeleteBacktestsRequest:
      properties:
        run_ids:
          items:
            type: string
          title: Run Ids
          type: array
      required:
      - run_ids
      title: BulkDeleteBacktestsRequest
      type: object
    BulkDeleteOptimizationsRequest:
      properties:
        study_ids:
          items:
            type: string
          title: Study Ids
          type: array
      required:
      - study_ids
      title: BulkDeleteOptimizationsRequest
      type: object
    BulkDeleteResponse:
      properties:
        deleted:
          title: Deleted
          type: integer
        not_found:
          items:
            type: string
          title: Not Found
          type: array
      required:
      - deleted
      - not_found
      title: BulkDeleteResponse
      type: object
    CapabilityRegistry:
      properties:
        condition_groups:
          items:
            type: string
          title: Condition Groups
          type: array
        data:
          $ref: '#/components/schemas/DataCapabilities'
        execution_assumptions:
          $ref: '#/components/schemas/ExecutionAssumptions'
        exit_presets:
          items:
            $ref: '#/components/schemas/ExitPreset'
          title: Exit Presets
          type: array
        exit_rules:
          items:
            $ref: '#/components/schemas/ExitRuleInfo'
          title: Exit Rules
          type: array
        genome_limits:
          $ref: '#/components/schemas/GenomeLimits'
        genome_nodes:
          items:
            $ref: '#/components/schemas/GenomeNodeCapability'
          title: Genome Nodes
          type: array
        genome_param_bounds:
          items:
            $ref: '#/components/schemas/StrategyParamSpec'
          title: Genome Param Bounds
          type: array
        operators:
          items:
            type: string
          title: Operators
          type: array
        risk_sizing:
          items:
            $ref: '#/components/schemas/RiskSizingCapability'
          title: Risk Sizing
          type: array
        schema_version:
          const: q_capabilities.v1
          default: q_capabilities.v1
